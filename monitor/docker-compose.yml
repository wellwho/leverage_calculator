services:
  flushmon:
    build:
      context: ..
      dockerfile: monitor/Dockerfile
    container_name: flushmon
    env_file: .env
    restart: unless-stopped
    volumes:
      - flushmon-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  flushmon-data:
